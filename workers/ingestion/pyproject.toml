[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-radar-worker"
version = "0.1.0"
description = "Daily ingestion worker for AI Learning Radar"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.9,<3.0",
  "youtube-transcript-api>=1.2,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.9,<1.0"]

[project.scripts]
ai-learning-radar-worker = "ai_learning_radar_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_learning_radar_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
