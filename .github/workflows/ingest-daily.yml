name: Ingest Daily Videos

permissions:
  contents: read

concurrency:
  group: ingest-daily
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      topic_id:
        description: Optional topic UUID
        required: false
        type: string
      dry_run:
        description: Run without database writes
        required: false
        type: boolean
        default: false
      run_id:
        description: Queued agent_runs UUID to claim (set by the admin console)
        required: false
        type: string
      video_url:
        description: Analyze a single YouTube video instead of the daily run
        required: false
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      TRANSCRIPT_MODE: disabled
      QUIZ_ENABLED: false
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TOPIC_ID: ${{ inputs.topic_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUN_ID: ${{ inputs.run_id }}
      VIDEO_URL: ${{ inputs.video_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install worker
        run: pip install -e './workers/ingestion[dev]'
      - name: Test worker
        run: |
          pytest workers/ingestion/tests -q
          ruff check workers/ingestion
      - name: Validate configuration
        run: python -m ai_learning_radar_worker.cli validate-config
      - name: Run daily ingestion
        shell: bash
        run: |
          if [[ -n "$VIDEO_URL" ]]; then
            args=(test-video --url "$VIDEO_URL")
            if [[ -n "$TOPIC_ID" ]]; then args+=(--topic-id "$TOPIC_ID"); fi
          else
            args=(daily)
            if [[ -n "$TOPIC_ID" ]]; then args+=(--topic-id "$TOPIC_ID"); fi
            if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
            if [[ -n "$RUN_ID" ]]; then args+=(--run-id "$RUN_ID"); fi
          fi
          python -m ai_learning_radar_worker.cli "${args[@]}"
