name: Worker CI

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "workers/ingestion/**"
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e './workers/ingestion[dev]'
      - run: pytest workers/ingestion/tests
      - run: ruff check workers/ingestion
